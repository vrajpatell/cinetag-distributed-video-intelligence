services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cinetag
      POSTGRES_PASSWORD: cinetag
      POSTGRES_DB: cinetag
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinetag"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama_models:/root/.ollama

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &backend_environment
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://cinetag:cinetag@postgres:5432/cinetag
      REDIS_URL: redis://valkey:6379/0
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /data/cinetag-store
      QUEUE_BACKEND: celery
      LLM_PROVIDER: ollama
      EMBEDDING_PROVIDER: ollama
      TRANSCRIPTION_PROVIDER: faster_whisper
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: qwen2:1.5b
      OLLAMA_EMBEDDING_MODEL: all-minilm
      VISION_PROVIDER: ollama
      OLLAMA_VISION_MODEL: granite3.2-vision:2b
      FASTER_WHISPER_MODEL: small
      FASTER_WHISPER_DEVICE: cpu
      FASTER_WHISPER_COMPUTE_TYPE: int8
      HF_HOME: /models
      SEMANTIC_SEARCH_BACKEND: python
      PGVECTOR_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_ENABLED: "false"
    ports: ["8000:8000"]
    volumes:
      - cinetag_media:/data/cinetag-store
      - huggingface_models:/models
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      ollama:
        condition: service_started

  worker:
    build: ./backend
    command: python -m app.workers.worker_main
    environment: *backend_environment
    volumes:
      - cinetag_media:/data/cinetag-store
      - huggingface_models:/models
    depends_on:
      backend:
        condition: service_started
      valkey:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_DEPLOY_PLATFORM: Docker Compose
      NEXT_PUBLIC_DEPLOY_REGION: local
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  valkey_data:
  ollama_models:
  cinetag_media:
  huggingface_models:
  frontend_node_modules:
