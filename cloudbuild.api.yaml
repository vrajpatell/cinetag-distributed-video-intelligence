steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - --build-arg
      - BACKEND_EXTRAS=gcp,openai
      - -t
      - us-central1-docker.pkg.dev/cinetag-distributed-video/cinetag-containers/cinetag-api:latest
      - ./backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/cinetag-distributed-video/cinetag-containers/cinetag-api:latest

images:
  - us-central1-docker.pkg.dev/cinetag-distributed-video/cinetag-containers/cinetag-api:latest
